[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
]

# `./scripts/validate.sh --only types` (scripts/validate-types.sh) runs mypy with
# this config. Coverage grows module by module: add a file to `files` once it
# passes `mypy --strict`. Pins live in scripts/requirements-mypy.txt.
[tool.mypy]
strict = true
python_version = "3.11"
files = [
  "scripts/validate_codex_native.py",
  "scripts/install_migrate.py",
  "scripts/codex_install.py",
  "scripts/generate_codex_plugin.py",
  "scripts/codex_native_smoke.py",
  "scripts/test_codex_native_smoke.py",
  "scripts/validate_capability_matrix.py",
  "scripts/generate_omp_skills.py",
  "scripts/test_generate_omp_skills.py",
  "scripts/generate_omp_agents.py",
  "scripts/test_generate_omp_agents.py",
  "scripts/generate_omp_commands.py",
  "scripts/test_generate_omp_commands.py",
  "scripts/omp_builtin_commands.py",
  "scripts/test_omp_builtin_commands.py",
  "scripts/mcp_secret_audit.py",
  "scripts/generate_omp_packages.py",
  "scripts/validate_omp_native.py",
  "scripts/test_generate_omp_packages.py",
  "scripts/omp_native_smoke.py",
  "scripts/test_validate_omp_hooks.py",
  "scripts/omp_herdr_smoke.py",
  "scripts/omp_scripted_smoke.py",
  "scripts/test_omp_scripted_smoke.py",
  "scripts/claude_agents_split.py",
  "scripts/claude_agents_split_smoke.py",
  "scripts/test_claude_agents_split.py",
  "scripts/omp_install.py",
  "scripts/test_omp_install.py",
  "scripts/tests/install/fake_omp.py",
  "scripts/generate_omp_rules.py",
  "scripts/test_generate_omp_rules.py",
  "scripts/omp_model_policy.py",
  "scripts/test_omp_model_policy.py",
  "scripts/opencode_plugin_catalog.py",
  "scripts/test_opencode_plugin_catalog.py",
  "scripts/install_slices.py",
  "scripts/slice_selection.py",
  "scripts/slice_deps.py",
  "scripts/slice_carriers.py",
  "scripts/test_install_slices_select.py",
]
