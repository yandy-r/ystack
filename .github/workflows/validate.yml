name: Validate bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-bundle:
    name: validate-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Legacy-cleanup tests prove ownership from git history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml==6.0.3 black==26.3.1 ruff==0.16.8 jsonschema==4.19.2 -r scripts/requirements-mypy.txt

      - name: Install pinned shellcheck
        run: ./scripts/install-shellcheck.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install locked Node deps
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unified validator
        run: ./scripts/validate.sh
